name: Build nxnative IPA
on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Python & Dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Toolchain
        run: |
          brew install llvm
          pip install -r requirements.txt

      - name: Inject Keys
        run: |
          mkdir -p keys
          echo "${{ secrets.PROD_KEYS }}" > keys/prod.keys

      - name: Download Large Game File
        run: |
          curl -L -o game.nsp "https://pixeldrain.com/api/file/cEDMkyi6"


      - name: Compile and Package Game
        run: |
          python build.py --target ios --input game.nsp

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nxnative-game-payload
          path: build/outputs/*.ipa
